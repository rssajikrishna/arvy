services:
  - type: web
    name: arvy-consulting
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard → Environment tab:
      # APP_URL        → your Render URL e.g. https://arvy-consulting.onrender.com
      # CONTACT_EMAIL  → inbox that receives form submissions
      # SMTP_HOST      → e.g. smtp.gmail.com
      # SMTP_PORT      → 587
      # SMTP_SECURE    → false
      # SMTP_USER      → your Gmail address
      # SMTP_PASS      → your Gmail App Password
      # VITE_CALENDLY_URL → https://calendly.com/richypeace123/30min
